[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Versões do compilador FIXAS (nada de "a mais nova instalada"):
#   0.7.6  -> contratos do Uniswap v3 (core + periphery) e o descriptor da KAMBIODEX
#   0.8.37 -> testes e scripts
# O Foundry escolhe o arquivo de cada versão pelo "pragma"; as restrições abaixo impedem
# que qualquer arquivo seja compilado por uma versão diferente destas. As bibliotecas em lib/
# herdam a versão do contrato que as importa.
auto_detect_solc = true
compilation_restrictions = [
  { paths = "src/Core.sol", version = "=0.7.6" },
  { paths = "src/Periphery.sol", version = "=0.7.6" },
  { paths = "src/periphery/**", version = "=0.7.6" },
  { paths = "src/testnet/**", version = "=0.8.37" },
  { paths = "test/**", version = "=0.8.37" },
  { paths = "script/**", version = "=0.8.37" },
  { paths = "lib/forge-std/**", version = "=0.8.37" },
]

# Mesmas opções da implantação oficial do Uniswap v3 (necessário para que o
# POOL_INIT_CODE_HASH e os endereços das pools saiam iguais ao original).
optimizer = true
optimizer_runs = 800
bytecode_hash = "none"
cbor_metadata = false
evm_version = "istanbul"

# Permissões de arquivo: ler os contratos compilados (out/) e gravar os endereços em deployments/.
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read-write", path = "../deployments" },
]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@uniswap/lib/=lib/solidity-lib/",
  "@uniswap/v2-core/=lib/v2-core/",
  "@uniswap/v3-core/=lib/v3-core/",
  "@uniswap/v3-periphery/=lib/v3-periphery/",
  "base64-sol/=lib/base64/",
  "forge-std/=lib/forge-std/src/",
]

# Endereços de RPC das redes de teste (definidos no .env; nunca no Git).
[rpc_endpoints]
amoy = "${AMOY_RPC_URL}"
bnb_testnet = "${BNB_TESTNET_RPC_URL}"

[fmt]
line_length = 100
