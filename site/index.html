:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--well:#F7F9FB;--line:#E0E5EC;--line2:#EDF0F4;
  --text:#0E1A2B;--muted:#586377;--btn:#10233F;--on-btn:#FFFFFF;--gold:#8A6417;
  --pos:#1E7A4B;--neg:#B3261E;--info-bg:#EEF3FB;--info-line:#CCDAF0;--info-text:#1F3F6E;--shadow:0 1px 0 rgba(14,26,43,.04);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}

:root[data-theme="dark"]{
  --bg:#0A111C;--surface:#111A28;--well:#0D1522;--line:#223047;--line2:#1A2638;
  --text:#EDF1F6;--muted:#9AA6B8;--btn:#E8EDF5;--on-btn:#0E1A2B;--gold:#D9B26A;
  --pos:#6FD39C;--neg:#FF8A80;--info-bg:#122238;--info-line:#26436B;--info-text:#A9C8F2;--shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.3px;color:var(--text);text-decoration:none}
.wm{display:flex;align-items:center;letter-spacing:.2px}.wm .wd{color:var(--gold)}
.wm em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--gold);border:1.5px solid var(--gold);border-radius:0;padding:1px 6px;margin-left:8px}
.mark{width:38px;height:38px;border-radius:0;background:var(--btn);color:var(--on-btn);display:grid;place-items:center}
nav{display:flex;gap:4px}
nav button{background:none;border:none;padding:10px 14px;min-height:44px;color:var(--muted);font-weight:500;border-radius:0}
nav button[aria-selected="true"]{color:var(--text);font-weight:600;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.right{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:0;padding:8px 12px;min-height:44px;font-weight:500;white-space:nowrap}
.chip svg.cv{opacity:.55}
.btn{background:var(--btn);color:var(--on-btn);border:none;border-radius:0;padding:10px 18px;min-height:44px;font-weight:600}
@media(max-width:760px){nav{order:3;width:100%;justify-content:space-between}nav button{flex:1}.brand{font-size:17px}}
.ico{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;letter-spacing:.2px;flex:none;color:#fff}
.ico.sm{width:20px;height:20px;font-size:8.5px}
.ico.lg{width:36px;height:36px;font-size:12px}
.ico img{width:100%;height:100%;object-fit:contain;display:block}
.ico.arb{background:transparent}
.ico.eth{background:#FFFFFF}
.ico.eth img{width:58%;height:58%}
.tok{border-radius:50%;background:var(--line2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.panel{display:none;padding-top:40px}
.panel.on{display:grid;gap:40px;grid-template-columns:1fr}
#swap.panel.on.split{display:flex;flex-direction:column;align-items:center;gap:28px}
#swap.panel.on.split>.card{order:1;width:100%;max-width:470px}
#swap.panel.on.split>div:first-child{order:2;width:100%;max-width:470px}
#swap .avail{margin-top:0;padding-top:0;border-top:0;justify-items:center;text-align:center}
#swap .logos{justify-content:center}
#swap .logos img.pg{height:17px;opacity:.9}
@media(min-width:960px){.panel.on.split{grid-template-columns:1fr 470px;align-items:start}}
h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(40px,6.2vw,68px);line-height:1;letter-spacing:-1px;margin:0 0 16px}
.lead{color:var(--muted);font-size:17px;max-width:44ch;margin:0}
.nets{margin-top:32px;border-top:1px solid var(--line)}
.nets div{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.nets small{margin-left:auto;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:0;padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);width:100%}
.card h2{font-size:17px;font-weight:600;margin:4px 6px 10px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-size:13px;color:var(--muted);font-weight:500}
.box{background:var(--well);border:1px solid var(--line2);border-radius:0;padding:14px 16px;display:grid;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lbl{font-size:13px;color:var(--muted)}
.amt{font-size:32px;font-weight:500;letter-spacing:-.5px;background:transparent;border:none;outline:none;width:100%;min-width:0;padding:0}
.amt:focus-visible{outline:none}
.sel{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:0;padding:6px 12px 6px 6px;min-height:44px;font-weight:600;white-space:nowrap}
.sel.net{border-radius:0;padding:5px 10px 5px 6px;min-height:36px;font-weight:500;font-size:14px}
.flipw{display:flex;justify-content:center;margin:-17px 0;position:relative;z-index:1}
.flip{width:40px;height:40px;border-radius:0;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 0 0 4px var(--surface)}
.info{display:none;align-items:center;gap:10px;background:var(--info-bg);border:1px solid var(--info-line);color:var(--info-text);border-radius:0;padding:10px 12px;font-size:14px;margin-top:8px}

const tIco=(s,sz="")=>(s==="POL"||s==="WPOL")?`<span class="ico arb ${sz}" aria-hidden="true"><img src="${POLT}" alt=""></span>`:(s==="ETH"||(s==="WETH"&&isVer("WETH")))?`<span class="ico tok eth ${sz}" aria-hidden="true"><img src="${ETHI}" alt=""></span>`:s==="ARB"?`<span class="ico arb ${sz}" aria-hidden="true"><img src="${ARB}" alt=""></span>`:TIMG[s]?`<span class="ico arb ${sz}" aria-hidden="true"><img src="${TIMG[s]}" alt=""></span>`:(isVer(s)&&NET().addr[s]&&/^0x[0-9a-fA-F]{40}$/.test(NET().addr[s]))?`<span class="ico tok ${sz}" aria-hidden="true"><img src="/logo/${NET().addr[s].toLowerCase()}" alt="" style="display:none" onload="var p=this.parentNode;this.style.display='block';p.className=p.className.replace('tok','arb');this.nextSibling.remove()" onerror="this.remove()">${s.slice(0,4)}</span>`:`<span class="ico tok ${sz}" aria-hidden="true">${s.slice(0,4)}</span>`;

/* static texts */
function applyStatic(){
  document.documentElement.lang=LANG==="pt"?"pt-BR":LANG;
  const V={net:NET().name};
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i,V));
  document.querySelectorAll("[data-ih]").forEach(e=>e.innerHTML=t(e.dataset.ih,V));
  document.querySelectorAll("[data-ia]").forEach(e=>e.dataset.ia.split(";").forEach(p=>{const [a,k]=p.split(":");e.setAttribute(a,t(k,V))}));
}
function renderAll(){if(typeof drawPool==="function"&&PP&&$("pool").classList.contains("on"))setTimeout(drawPool);document.documentElement.classList.toggle("one-net",Object.keys(NETS).length<2);applyStatic();paint();drawPools();drawMine();drawStats()}


/* swap */
function paint(){
  if($("pxc"))drawPx();
  $("netBtn").innerHTML=nIco("sm")+`<span class="nn">${NET().name}</span>`+cv;
  $("netTag").innerHTML=nIco("sm")+NET().name+cv;
  $("gasVal").textContent=t("gasVal",{net:NET().name,g:NET().gas||"ETH"});
  $("fromTok").innerHTML=tIco(S.fromTok)+S.fromTok+cv;
  $("toTok").innerHTML=tIco(S.toTok)+S.toTok+cv;
  const WI='<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-3px"><rect x="3" y="6" width="18" height="13" rx="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16 12.5h2M3 9h13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  $("wallet").innerHTML=S.wallet?`<span class="hide-sm">0x7a3F…c91E</span><span class="show-sm">0x7a…1E</span>`:`<span class="hide-sm">${t("connect")}</span><span class="show-sm">${WI}</span>`;
  $("wallet").setAttribute("aria-label",S.wallet?"0x7a3F…c91E":t("connect"));
  calc();
}
function calc(){
  const amt=num($("pay").value);
  const f=S.fromTok,g=S.toTok,rate=TOK[f].p/TOK[g].p,out=amt*rate*0.997;
  $("rec").textContent=fmt(out,6);
  $("payUsd").textContent="≈ US$ "+fmt(amt*TOK[f].p,2);
  $("recUsd").textContent="≈ US$ "+fmt(out*TOK[g].p,2);
  $("rate").textContent=`1 ${f} = ${fmt(rate,6)} ${g}`;
  const wrap=(f==="POL"&&g==="WPOL")||(f==="WPOL"&&g==="POL");
  $("route").textContent=wrap?t("wrapRoute"):`Pool ${W_(f)}/${W_(g)}`;
  $("fromA").innerHTML=isVer(f)?"":tokAddr(f);$("toA").innerHTML=isVer(g)?"":tokAddr(g);
  $("dlV").textContent=t("dlMin",{n:S.dl});
  $("slipV").textContent=fmt(S.slip,2)+"%";
  $("minRec").textContent=`${fmt(out*(1-S.slip/100),6)} ${g}`;
  $("go").textContent=!S.wallet?t("connect"):t("doSwap");
  $("okSwap").textContent="";
  const rk=swRisk();
  if(rk){if(S.riskTok!==f+g){S.riskOk=false;S.riskTok=f+g}
    $("swWarn").innerHTML=`<div class="warn" style="margin:6px 0 0"><strong>${t("unverT")}</strong><span>${t("swRiskL",{t:[f,g].filter(k=>!isVer(k)).join(", ")})}</span><label class="ck" style="margin-top:6px"><input type="checkbox" id="swOk" ${S.riskOk?"checked":""}> ${t("impRisk")}</label></div>`;
    $("swOk").onchange=e=>{S.riskOk=e.target.checked;$("okSwap").textContent="";$("go").disabled=S.wallet&&!S.riskOk};
    $("go").disabled=S.wallet&&!S.riskOk;
  }else{$("swWarn").innerHTML="";$("go").disabled=false}
  return out;
}
const DOCS={"pt": {"terms": {"t": "Termos de Uso", "h": "<p>Ao conectar sua carteira à KAMBIODEX, você declara que leu, compreendeu e aceita estes Termos.<\/p>\n<h4>1. O que é o serviço<\/h4><p>A KAMBIODEX é uma <strong>interface de código livre<\/strong> que facilita o uso de contratos inteligentes públicos, autônomos e descentralizados, de liquidez concentrada. No lançamento, o serviço funciona na rede <strong>Polygon<\/strong>. A rede <strong>BNB Chain<\/strong> será adicionada em breve.<\/p><p>O projeto tem caráter tecnológico e experimental. A KAMBIODEX não é corretora, <strong>não guarda seus ativos, não tem acesso às suas chaves privadas<\/strong>, não processa pagamentos e não pode desfazer transações nem congelar fundos na blockchain.<\/p>\n<h4>2. Quem pode usar<\/h4><ul><li>Pessoas com 18 anos ou mais e plena capacidade legal na sua jurisdição.<\/li><li>Cujas carteiras não constem em listas de sanções internacionais (como OFAC e ONU).<\/li><li>Quem usa é responsável por verificar se o uso é permitido onde vive.<\/li><\/ul>\n<h4>3. Taxas e custos<\/h4><p>A KAMBIODEX não cobra taxa pelo uso da interface. Ao fazer uma troca, os custos são:<\/p><ul><li><strong>Taxa da pool:<\/strong> 0,01%, 0,05%, 0,30% ou 1%, cobrada pelo próprio contrato. No lançamento, a <strong>taxa do protocolo está desligada<\/strong> e 100% da taxa vai para quem fornece liquidez naquela pool. Se a taxa do protocolo for ativada, uma parte da taxa irá para a KAMBIODEX, e isso será avisado nesta página antes.<\/li><li><strong>Taxa de rede (gás):<\/strong> cobrada pela rede para validar a transação, paga na moeda nativa da rede (POL ou BNB).<\/li><\/ul>\n<h4>4. Impostos<\/h4><p>A KAMBIODEX é uma interface de código livre. Ela não é instituição financeira, intermediária nem corretora centralizada. Por isso, não retém impostos, não envia informações a autoridades fiscais e não declara nada em nome de ninguém. Cabe a cada pessoa calcular, declarar e pagar os tributos devidos conforme a lei do seu país.<\/p>\n<h4>5. Tokens e ativos de terceiros<\/h4><p>Qualquer pessoa pode criar um token ou uma pool na blockchain. A KAMBIODEX não emite, não patrocina, não audita e não garante nenhum ativo.<\/p><ul><li>O selo <strong>\"Verificado\"<\/strong> indica apenas que o endereço do contrato consta na lista de tokens mantida pela KAMBIODEX, para ajudar a evitar clones de nome. Não é recomendação de investimento, nem garantia de segurança ou de valor.<\/li><li>Tokens fora da lista mostram o alerta <strong>\"[ RISCO DE TOKEN MALICIOSO ]\"<\/strong> e pedem confirmação extra. Podem ter sido criados por golpistas copiando nomes conhecidos.<\/li><\/ul>\n<h4>6. Condutas proibidas<\/h4><p>É proibido usar a interface para lavagem de dinheiro, financiamento ao terrorismo, fraude, manipulação de preços, ataques, exploração de falhas de terceiros ou qualquer uso que viole a lei aplicável.<\/p>\n<h4>7. Limitação de responsabilidade<\/h4><p>O serviço é oferecido \"no estado em que se encontra\" (\"as is\" e \"as available\"), sem garantias de qualquer tipo. Na máxima extensão permitida pela lei aplicável, a KAMBIODEX, seus desenvolvedores e colaboradores não respondem por perdas decorrentes de:<\/p><ul><li>variação de preços dos ativos;<\/li><li>falhas, bugs ou ataques aos contratos inteligentes;<\/li><li>falhas de terceiros, como provedores de nós (RPC) ou das redes Polygon e BNB Chain;<\/li><li>ataques cibernéticos, perda da frase de recuperação ou uso de carteira comprometida;<\/li><li>operações antecipadas por robôs (MEV, \"front-running\" e \"sandwich\");<\/li><li>tokens criados por terceiros ou erros do próprio usuário.<\/li><\/ul>\n<h4>8. Privacidade<\/h4><p>A interface <strong>não pede nem coleta<\/strong> nome, documentos, e-mail ou dados bancários.<\/p><ul><li><strong>Registros no servidor:<\/strong> o provedor de hospedagem e segurança (Cloudflare) registra dados técnicos de acesso, como endereço IP, país aproximado, data e hora, para o funcionamento e a segurança do site. Esses registros podem ser fornecidos a autoridades quando a lei exigir.<\/li><li><strong>Neste navegador:<\/strong> ficam guardados apenas as suas preferências (idioma, tema, limites de troca) e o seu aceite destes Termos.<\/li><li><strong>Blockchain é pública:<\/strong> toda transação feita com a sua carteira é permanente e visível para qualquer pessoa. Ninguém consegue alterá-la ou apagá-la.<\/li><\/ul>\n<h4>9. Software livre e marcas<\/h4><p>Os contratos e a interface são <strong>código livre<\/strong>. Os contratos são derivados de software licenciado sob a GPL-2.0-or-later (originalmente publicado pela Uniswap Labs). O código-fonte está disponível no GitHub (link no rodapé do site). Uniswap é marca da Uniswap Labs. A KAMBIODEX não tem afiliação com a Uniswap Labs nem é endossada por ela.<\/p>"}, "risks": {"t": "Aviso de Riscos", "h": "<p><strong>Leia com atenção. Ao usar a interface, você assume o risco de perder parte ou todo o valor usado.<\/strong><\/p>\n<ul><li><strong>Volatilidade:<\/strong> os preços de criptoativos podem cair muito em pouco tempo.<\/li>\n<li><strong>Dados desatualizados:<\/strong> o site lê dados de provedores externos (nós RPC e indexadores). Atrasos podem mostrar preços ou saldos desatualizados.<\/li>\n<li><strong>Robôs e MEV:<\/strong> a blockchain é pública. Robôs podem ver sua transação antes de ela ser concluída e agir antes de você. O preço final pode variar até o limite da tolerância de preço que você definir.<\/li>\n<li><strong>Tokens falsos:<\/strong> qualquer pessoa pode criar um token com o mesmo nome (como USDT ou USDC) de um ativo legítimo. Confira sempre o endereço do contrato antes de aprovar.<\/li>\n<li><strong>Aprovações:<\/strong> ao aprovar um token, o contrato fica autorizado a usá-lo na sua carteira até você revogar a aprovação.<\/li>\n<li><strong>Perda impermanente:<\/strong> quem fornece liquidez pode terminar com menos valor do que se tivesse apenas guardado as moedas.<\/li>\n<li><strong>Faixa de preço:<\/strong> na liquidez concentrada, se o preço sair da faixa escolhida, a posição deixa de render taxas e fica 100% em uma das duas moedas (a que perdeu valor em relação à outra).<\/li>\n<li><strong>Contratos inteligentes:<\/strong> mesmo códigos muito usados podem ter falhas ainda desconhecidas.<\/li>\n<li><strong>Transações irreversíveis:<\/strong> envio para endereço errado ou aprovação de contrato malicioso não podem ser desfeitos por ninguém.<\/li>\n<li><strong>Chave da carteira:<\/strong> quem perde a frase de recuperação perde os fundos; quem a revela pode ter os fundos roubados.<\/li>\n<li><strong>Redes e regras:<\/strong> as redes podem ficar instáveis, e as regras sobre criptoativos podem mudar.<\/li><\/ul>\n<p>Nada na KAMBIODEX é recomendação financeira, de investimento ou tributária. A interface é apenas uma ferramenta de software. Decida por conta própria e, se precisar, procure um profissional.<\/p>"}}, "en": {"terms": {"t": "Terms of Use", "h": "<p>By connecting your wallet to KAMBIODEX, you confirm that you have read, understood and accept these Terms.<\/p>\n<h4>1. What the service is<\/h4><p>KAMBIODEX is an <strong>open-source interface<\/strong> that makes it easier to use public, autonomous, decentralized concentrated-liquidity smart contracts. At launch, the service runs on the <strong>Polygon<\/strong> network. <strong>BNB Chain<\/strong> support is coming soon.<\/p><p>The project is technological and experimental. KAMBIODEX is not an exchange broker, <strong>does not hold your assets, has no access to your private keys<\/strong>, does not process payments, and cannot reverse transactions or freeze funds on the blockchain.<\/p>\n<h4>2. Who can use it<\/h4><ul><li>People aged 18 or older with full legal capacity in their jurisdiction.<\/li><li>Whose wallets are not on international sanctions lists (such as OFAC and the UN).<\/li><li>You are responsible for checking whether using the service is allowed where you live.<\/li><\/ul>\n<h4>3. Fees and costs<\/h4><p>KAMBIODEX charges no fee for using the interface. When you swap, the costs are:<\/p><ul><li><strong>Pool fee:<\/strong> 0.01%, 0.05%, 0.30% or 1%, charged by the contract itself. At launch, the <strong>protocol fee is turned off<\/strong> and 100% of the fee goes to the liquidity providers of that pool. If the protocol fee is turned on, part of the fee will go to KAMBIODEX, and this page will say so beforehand.<\/li><li><strong>Network fee (gas):<\/strong> charged by the network to validate the transaction, paid in the network's native coin (POL or BNB).<\/li><\/ul>\n<h4>4. Taxes<\/h4><p>KAMBIODEX is an open-source interface. It is not a financial institution, an intermediary or a centralized exchange. It therefore does not withhold taxes, does not send information to tax authorities and does not file anything on anyone's behalf. Each person is responsible for calculating, reporting and paying the taxes due under the law of their country.<\/p>\n<h4>5. Third-party tokens and assets<\/h4><p>Anyone can create a token or a pool on the blockchain. KAMBIODEX does not issue, sponsor, audit or guarantee any asset.<\/p><ul><li>The <strong>\"Verified\"<\/strong> badge only means that the contract address is on the token list maintained by KAMBIODEX, to help prevent name clones. It is not investment advice, nor a guarantee of safety or value.<\/li><li>Tokens not on the list show the warning <strong>\"[ MALICIOUS TOKEN RISK ]\"<\/strong> and ask for extra confirmation. They may have been created by scammers copying well-known names.<\/li><\/ul>\n<h4>6. Prohibited conduct<\/h4><p>You may not use the interface for money laundering, terrorist financing, fraud, price manipulation, attacks, exploiting third-party vulnerabilities, or any use that breaks applicable law.<\/p>\n<h4>7. Limitation of liability<\/h4><p>The service is provided \"as is\" and \"as available\", without warranties of any kind. To the fullest extent permitted by applicable law, KAMBIODEX, its developers and contributors are not liable for losses arising from:<\/p><ul><li>changes in asset prices;<\/li><li>failures, bugs or attacks on smart contracts;<\/li><li>third-party failures, such as node providers (RPC) or the Polygon and BNB Chain networks;<\/li><li>cyberattacks, loss of the recovery phrase, or use of a compromised wallet;<\/li><li>bots front-running transactions (MEV, front-running and sandwich attacks);<\/li><li>tokens created by third parties, or the user's own mistakes.<\/li><\/ul>\n<h4>8. Privacy<\/h4><p>The interface <strong>does not ask for or collect<\/strong> your name, documents, email or bank details.<\/p><ul><li><strong>Server records:<\/strong> the hosting and security provider (Cloudflare) records technical access data, such as IP address, approximate country, date and time, for the operation and security of the site. These records may be provided to authorities when the law requires it.<\/li><li><strong>In this browser:<\/strong> only your preferences (language, theme, swap limits) and your acceptance of these Terms are stored.<\/li><li><strong>The blockchain is public:<\/strong> every transaction made with your wallet is permanent and visible to anyone. No one can change or erase it.<\/li><\/ul>\n<h4>9. Open-source software and trademarks<\/h4><p>The contracts and the interface are <strong>open source<\/strong>. The contracts are derived from software licensed under GPL-2.0-or-later (originally published by Uniswap Labs). The source code is available on GitHub (link in the site footer). Uniswap is a trademark of Uniswap Labs. KAMBIODEX is not affiliated with Uniswap Labs and is not endorsed by it.<\/p>"}, "risks": {"t": "Risk Notice", "h": "<p><strong>Read carefully. By using the interface, you accept the risk of losing part or all of the value you use.<\/strong><\/p>\n<ul><li><strong>Volatility:<\/strong> crypto asset prices can fall sharply in a short time.<\/li>\n<li><strong>Outdated data:<\/strong> the site reads data from external providers (RPC nodes and indexers). Delays can show outdated prices or balances.<\/li>\n<li><strong>Bots and MEV:<\/strong> the blockchain is public. Bots can see your transaction before it completes and act ahead of you. The final price can vary up to the price tolerance you set.<\/li>\n<li><strong>Fake tokens:<\/strong> anyone can create a token with the same name (such as USDT or USDC) as a legitimate asset. Always check the contract address before approving.<\/li>\n<li><strong>Approvals:<\/strong> when you approve a token, the contract stays authorized to use it from your wallet until you revoke the approval.<\/li>\n<li><strong>Impermanent loss:<\/strong> liquidity providers can end up with less value than if they had simply held the coins.<\/li>\n<li><strong>Price range:<\/strong> in concentrated liquidity, if the price leaves your chosen range, the position stops earning fees and ends up 100% in one of the two coins (the one that lost value against the other).<\/li>\n<li><strong>Smart contracts:<\/strong> even widely used code can have flaws that are not yet known.<\/li>\n<li><strong>Irreversible transactions:<\/strong> sending to the wrong address or approving a malicious contract cannot be undone by anyone.<\/li>\n<li><strong>Wallet key:<\/strong> if you lose your recovery phrase you lose your funds; if you reveal it, your funds can be stolen.<\/li>\n<li><strong>Networks and rules:<\/strong> networks can become unstable, and rules about crypto assets can change.<\/li><\/ul>\n<p>Nothing on KAMBIODEX is financial, investment or tax advice. The interface is only a software tool. Decide for yourself and, if you need to, talk to a professional.<\/p>"}}, "es": {"terms": {"t": "Términos de Uso", "h": "<p>Al conectar tu billetera a KAMBIODEX, declaras que has leído, comprendido y aceptas estos Términos.<\/p>\n<h4>1. Qué es el servicio<\/h4><p>KAMBIODEX es una <strong>interfaz de código abierto<\/strong> que facilita el uso de contratos inteligentes públicos, autónomos y trong>\"Verificado\"<\/strong> solo indica que la dirección del contrato figura en la lista de tokens que mantiene KAMBIODEX, para ayudar a evitar clones de nombre. No es una recomendación de inversión ni una garantía de seguridad o de valor.<\/li><li>Los tokens fuera de la lista muestran la alerta <strong>\"[ RIESGO DE TOKEN MALICIOSO ]\"<\/strong> y piden una confirmación adicional. Pueden haber sido creados por estafadores que copian nombres conocidos.<\/li><\/ul>\n<h4>6. Conductas prohibidas<\/h4><p>Está prohibido usar la interfaz para lavado de dinero, financiamiento del terrorismo, fraude, manipulación de precios, ataques, explotación de fallas de terceros o cualquier uso que infrinja la ley aplicable.<\/p>\n<h4>7. Limitación de responsabilidad<\/h4><p>El servicio se ofrece \"tal cual\" (\"as is\" y \"as available\"), sin garantías de ningún tipo. En la máxima medida permitida por la ley aplicable, KAMBIODEX, sus desarrolladores y colaboradores no responden por pérdidas derivadas de:<\/p><ul><li>variaciones en el precio de los activos;<\/li><li>fallas, errores o ataques a los contratos inteligentes;<\/li><li>fallas de terceros, como proveedores de nodos (RPC) o las redes Polygon y BNB Chain;<\/li><li>ciberataques, pérdida de la frase de recuperación o uso de una billetera comprometida;<\/li><li>operaciones adelantadas por bots (MEV, \"front-running\" y \"sandwich\");<\/li><li>tokens creados por terceros o errores del propio usuario.<\/li><\/ul>\n<h4>8. Privacidad<\/h4><p>La interfaz <strong>no pide ni recopila<\/strong> nombre, documentos, correo electrónico ni datos bancarios.<\/p><ul><li><strong>Registros en el servidor:<\/strong> el proveedor de alojamiento y seguridad (Cloudflare) registra datos técnicos de acceso, como dirección IP, país aproximado, fecha y hora, para el funcionamiento y la seguridad del sitio. Estos registros pueden entregarse a autoridades cuando la ley lo exija.<\/li><li><strong>En este navegador:<\/strong> solo se guardan tus preferencias (idioma, tema, límites de intercambio) y tu aceptación de estos Términos.<\/li><li><strong>La blockchain es pública:<\/strong> toda transacción hecha con tu billetera es permanente y visible para cualquiera. Nadie puede modificarla ni borrarla.<\/li><\/ul>\n<h4>9. Software libre y marcas<\/h4><p>Los contratos y la interfaz son <strong>código abierto<\/strong>. Los contratos derivan de software con licencia GPL-2.0-or-later (publicado originalmente por Uniswap Labs). El código fuente está disponible en GitHub (enlace en el pie del sitio). Uniswap es una marca de Uniswap Labs. KAMBIODEX no tiene afiliación con Uniswap Labs ni cuenta con su respaldo.<\/p>"}, "risks": {"t": "Aviso de Riesgos", "h": "<p><strong>Lee con atención. Al usar la interfaz, asumes el riesgo de perder parte o todo el valor que uses.<\/strong><\/p>\n<ul><li><strong>Volatilidad:<\/strong> los precios de los criptoactivos pueden caer mucho en poco tiempo.<\/li>\n<li><strong>Datos desactualizados:<\/strong> el sitio lee datos de proveedores externos (nodos RPC e indexadores). Los retrasos pueden mostrar precios o saldos desactualizados.<\/li>\n<li><strong>Bots y MEV:<\/strong> la blockchain es pública. Los bots pueden ver tu transacción antes de que se complete y actuar antes que tú. El precio final puede variar hasta el límite de la tolerancia de precio que definas.<\/li>\n<li><strong>Tokens falsos:<\/strong> cualquiera puede crear un token con el mismo nombre (como USDT o USDC) que un activo legítimo. Verifica siempre la dirección del contrato antes de aprobar.<\/li>\n<li><strong>Aprobaciones:<\/strong> al aprobar un token, el contrato queda autorizado a usarlo desde tu billetera hasta que revoques la aprobación.<\/li>\n<li><strong>Pérdida impermanente:<\/strong> quien aporta liquidez puede terminar con menos valor que si solo hubiera guardado las monedas.<\/li>\n<li><strong>Rango de precio:<\/strong> en la liquidez concentrada, si el precio sale del rango elegido, la posición deja de generar comisiones y queda 100% en una de las dos monedas (la que perdió valor frente a la otra).<\/li>\n<li><strong>Contratos inteligentes:<\/strong> incluso el código muy usado puede tener fallas aún desconocidas.<\/li>\n<li><strong>Transacciones irreversibles:<\/strong> enviar a una dirección equivocada o aprobar un contrato malicioso no puede deshacerlo nadie.<\/li>\n<li><strong>Clave de la billetera:<\/strong> quien pierde la frase de recuperación pierde los fondos; quien la revela puede sufrir el robo de sus fondos.<\/li>\n<li><strong>Redes y normas:<\/strong> las redes pueden volverse inestables y las normas sobre criptoactivos pueden cambiar.<\/li><\/ul>\n<p>Nada en KAMBIODEX es asesoría financiera, de inversión ni tributaria. La interfaz es solo una herramienta de software. Decide por tu cuenta y, si lo necesitas, consulta a un profesional.<\/p>"}}};

/* pool liquidity-by-price chart (illustrative distribution in the prototype) */
const DW=600,DH=170,NB=56;
function liqDist(x,y,P){
  let sd=0;for(const c of x+y)sd=(sd*31+c.charCodeAt(0))%2147483647;
  const r=()=>{sd=(sd*16807)%2147483647;return (sd-1)/2147483646};
  const d0=P*0.3,d1=P*1.7,bins=[];
  for(let i=0;i<NB;i++){const v=d0+(i+0.5)*(d1-d0)/NB,z=(v-P)/(P*0.17),z2=(v-P*1.22)/(P*0.08),z3=(v-P*0.8)/(P*0.06);
    bins.push(0.06+Math.exp(-z*z)+0.35*Math.exp(-z2*z2)+0.25*Math.exp(-z3*z3)+0.12*r())}
  return {d0,d1,bins};
}
function depth(x,y,P,R){
  if(R.newPool)return `<div class="dch"><div class="dch-h"><small>${t("liqChart")}</small></div><p class="note" style="text-align:left;margin:0">${t("newPoolChart")}</p>${rbar(R.lo,R.hi,P,false)}<div class="dch-f"><span>${t("initP")}: <b>${fmtP(P)}</b> ${t("per",{a:x,b:y})}</span></div></div>`;
  const {d0,d1,bins}=liqDist(x,y,P),mx=Math.max(...bins),bw=DW/NB,X=v=>Math.max(0,Math.min(DW,(v-d0)/(d1-d0)*DW));
  const lo=X(R.lo),hi=X(R.hi),pp=X(P);let tot=0,inR=0;
  const bars=bins.map((h,i)=>{const v0=d0+i*(d1-d0)/NB,v1=v0+(d1-d0)/NB,on=v1>R.lo&&v0<R.hi;tot+=h;if(on)inR+=h;const hh=h/mx*(DH-24);
    return`<rect class="${on?"dbon":"dboff"}" x="${(i*bw+bw*.12).toFixed(1)}" y="${(DH-hh).toFixed(1)}" width="${(bw*.76).toFixed(1)}" height="${hh.toFixed(1)}"/>`}).join('');
  const hd=(xx,k)=>`<g class="dh" data-h="${k}"><line x1="${xx}" x2="${xx}" y1="0" y2="${DH}"/><rect x="${xx-7}" y="${DH/2-18}" width="14" height="36"/><line class="grip" x1="${xx-2}" x2="${xx-2}" y1="${DH/2-8}" y2="${DH/2+8}"/><line class="grip" x1="${xx+2}" x2="${xx+2}" y1="${DH/2-8}" y2="${DH/2+8}"/></g>`;
  return `<div class="dch"><div class="dch-h"><small>${t("liqChart")}</small><span class="tag" style="margin:0">${t("sampleLiq")}</span></div>
   <svg viewBox="-8 -4 ${DW+16} ${DH+26}" id="dsvg" role="img" aria-label="${t("liqChart")}">
    <rect class="dsel" x="${lo}" y="0" width="${Math.max(0,hi-lo)}" height="${DH}"/>${bars}
    <line class="dcur" x1="${pp}" x2="${pp}" y1="-4" y2="${DH}"/>${hd(lo,"lo")}${hd(hi,"hi")}
    <text class="ax" x="0" y="${DH+18}">${fmtP(d0)}</text><text class="ax" x="${pp}" y="${DH+18}" text-anchor="middle">${fmtP(P)}</text><text class="ax" x="${DW}" y="${DH+18}" text-anchor="end">${fmtP(d1)}</text>
   </svg>
   <div class="dch-f"><span>${t("curP")}: <b>${fmtP(P)}</b> ${t("per",{a:x,b:y})}</span><span>${t("liqCover",{x:fmt(tot?inR/tot*100:0,0)})}</span></div>
   <small class="cur">${t("dragHint")}</small></div>`;
}
function bindDepth(A,B,R,upd,GP){
  const box=$("rbx");let drag=null;
  const val=e=>{const sv=$("dsvg");if(!sv)return null;const r=sv.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width*(DW+16)-8;const P=GP(),d0=P*0.3,d1=P*1.7;return d0+Math.max(0,Math.min(DW,fx))/DW*(d1-d0)};
  box.addEventListener("pointerdown",e=>{if(R.full||!e.target.closest("#dsvg")||R.newPool)return;const v=val(e);if(v==null)return;drag=Math.abs(v-R.lo)<Math.abs(v-R.hi)?"lo":"hi";box.setPointerCapture(e.pointerId);move(e);e.preventDefault()});
  const move=e=>{if(!drag)return;const v=val(e);if(v==null)return;const P=GP();if(drag==="lo")R.lo=Math.min(v,R.hi-P*0.01);else R.hi=Math.max(v,R.lo+P*0.01);
    document.querySelectorAll("#presets button").forEach(z=>z.setAttribute("aria-pressed","false"));upd()};
  box.addEventListener("pointermove",move);
  ["pointerup","pointercancel"].forEach(ev=>box.addEventListener(ev,()=>drag=null));
}

/* pair price chart (KAMBIODEX pool price; simulated in the prototype) */
let PXP="1D",PXHOV=null;
const PXN={"1H":60,"1D":96,"1W":84,"1M":90},PXSTEP={"1H":60e3,"1D":15*60e3,"1W":2*3600e3,"1M":8*3600e3},PXVOL={"1H":.0012,"1D":.004,"1W":.011,"1M":.02};
function pxSeries(a,b){
  return null; /* no price history until the indexer exists */
  const P=PX(a,b);if(!(P>0))return null;
  let sd=7;for(const c of a+b+PXP)sd=(sd*31+c.charCodeAt(0))%2147483647;const r=()=>{sd=(sd*16807)%2147483647;return (sd-1)/2147483646};
  const n=PXN[PXP],v=PXVOL[PXP],out=[P];let x=P;
  const stable=(a.startsWith("USD")&&b.startsWith("USD"));
  for(let i=1;i<n;i++){x=x*(1+(r()-.5)*2*(stable?v/20:v)+(stable?(1-x/P)*.3:0));out.unshift(x)}
  const now=Date.now();return out.map((y,i)=>({y,t:now-(n-1-i)*PXSTEP[PXP]}));
}

var LIVE={
  chainHex:"0x89", /* 137 */

  minTipGwei:30n,     /* Polygon PoS requires a priority fee of at least 25 gwei */

const ADDR=k=>NET().addr[W_(k)]; /* POL maps to WPOL for contract calls */
/* ---- hex / ABI helpers ---- */
const h32=n=>BigInt(n).toString(16).padStart(64,"0");
const encA=a=>a.toLowerCase().replace(/^0x/,"").padStart(64,"0");
const SEL={balanceOf:"70a08231",allowance:"dd62ed3e",approve:"095ea7b3",decimals:"313ce567",getPool:"1698ee82",
  quote:"c6a5026a",exactIn:"414bf389",multicall:"ac9650d8",unwrap:"49404b7c",refund:"12210e8a",deposit:"d0e30db0",
  withdraw:"2e1a7d4d",slot0:"3850c7bd",token0:"0dfe1681",quotePath:"cdca1753",exactInPath:"c04b8d59"};
const word=(hex,i)=>BigInt("0x"+(hex.replace(/^0x/,"").slice(i*64,i*64+64)||"0"));
const wordAddr=(hex,i)=>"0x"+hex.replace(/^0x/,"").slice(i*64+24,i*64+64);
function encMulticall(calls){ /* multicall(bytes[]) */
  const n=calls.length;let head=h32(32)+h32(n),tails="",off=n*32;
  const parts=calls.map(c=>{c=c.replace(/^0x/,"");const len=c.length/2;const padded=c.padEnd(Math.ceil(len/32)*64,"0");return h32(len)+padded});
  parts.forEach(p=>{head+=h32(off);off+=p.length/2});
  return "0x"+SEL.multicall+head+parts.join("");
}
/* decimal string -> units (BigInt), no floating point */
function toUnits(str,dec){
  str=String(str).trim();if(LANG==="en")str=str.replace(/,/g,"");else str=str.replace(/\./g,"").replace(",",".");
  if(!/^\d*\.?\d*$/.test(str)||str===""||str===".")return 0n;
  let [i,f=""]=str.split(".");f=(f+"0".repeat(dec)).slice(0,dec);return BigInt(i||"0")*10n**BigInt(dec)+BigInt(f||"0");
}
const fromUnits=(v,dec)=>{const s=v.toString().padStart(dec+1,"0");return parseFloat(s.slice(0,-dec)+"."+s.slice(-dec))};
/* ---- RPC (read-only, public endpoints with fallback) ---- */
async function rpc(method,params){
  let err;for(const u of LIVE.rpcs){try{
    const r=await fetch(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method,params})});
    const j=await r.json();if(j.error)throw Object.assign(new Error(j.error.message||"rpc"),{rpc:j.error});return j.result}
    catch(e){err=e;if(e.rpc)throw e}}
  throw err;
}
const ethCall=(to,data,from)=>rpc("eth_call",[{to,data,...(from?{from}:{})},"latest"]);
async function decOf(k){if(LIVE.dec[k]!=null)return LIVE.dec[k];
  try{LIVE.dec[k]=Number(word(await ethCall(ADDR(k),"0x"+SEL.decimals),0))}catch(e){LIVE.dec[k]=18}return LIVE.dec[k]}
async function getPool(a,b,tier){
  const key=[a,b].sort().join("|")+"|"+tier;if(LIVE.poolCache[key]!==undefined&&!(LIVE.poolCache[key]===null&&Date.now()-(LIVE.poolNullT&&LIVE.poolNullT[key]||0)>45000))return LIVE.poolCache[key];
  const fee=Math.round(tier*10000);
  const r=await ethCall(OFF("cFactory"),"0x"+SEL.getPool+encA(ADDR(a))+encA(ADDR(b))+h32(fee));
  const p=wordAddr(r,0);LIVE.poolCache[key]=/^0x0{40}$/.test(p)?null:p;
  if(LIVE.poolCache[key]===null){(LIVE.poolNullT=LIVE.poolNullT||{})[key]=Date.now()}return LIVE.poolCache[key];
}
const tierOf=(a,b)=>{const m=NET().pairs.filter(([x,y])=>(W_(x)===W_(a)&&W_(y)===W_(b))||(W_(x)===W_(b)&&W_(y)===W_(a)));
  if(m.length>1){try{let best=null,bw=-1;m.forEach(p=>{const d=MK.pools[pkey(a,b,p[4]||0.3)],w=d?d.ra*d.P+d.rb:0;if(w>bw){bw=w;best=p}});if(best)return best[4]||0.3}catch(e){}}
  const p=m[0];return p?(p[4]||0.3):0.3};
/* one balance, with validation + retries: an empty or failed answer is never taken as "0" */
async function readBal(k,me){
  let err;for(let i=0;i<3;i++){try{
    if(k==="POL")return BigInt(await rpc("eth_getBalance",[me,"latest"]));
    const r=await ethCall(ADDR(k),"0x"+SEL.balanceOf+encA(me));
    if(typeof r==="string"&&r.replace(/^0x/,"").length>=64)return word(r,0);
    throw new Error("empty")}catch(e){err=e;await new Promise(z=>setTimeout(z,250*(i+1)))}}
  throw err;
}
async function loadBalances(){
  if(!LIVE.acct)return;
  const me=LIVE.acct,out={},list=NET().tokens.slice();
  const worker=async()=>{while(list.length){const k=list.shift();try{out[k]=await readBal(k,me);await decOf(k)}catch(e){}}};
  await Promise.all([worker(),worker(),worker(),worker()]); /* 4 at a time: public RPCs refuse big bursts */
  if(LIVE.acct!==me)return;
  LIVE.bal=Object.assign(LIVE.bal||{},out);paintBal();
}

const ROUTE_TIERS=[0.01,0.05,0.3,1];
const pathHex=hops=>{let s=encA(ADDR(hops[0].a)).slice(24);hops.forEach(h=>{s+=Math.round(h.tier*10000).toString(16).padStart(6,"0")+encA(ADDR(h.b)).slice(24)});return s};
const padHex=s=>s.padEnd(Math.ceil(s.length/64)*64,"0");
async function quoteHops(hops,amtIn){

/* best route: direct pool in every fee tier, or through 1 or 2 verified tokens (max 3 pools) */
async function findRoute(f,g,amtIn){
  const A=W_(f),B=W_(g);
  const mids=[...VER[S.net]].filter(k=>k!=="POL"&&k!==A&&k!==B&&NET().addr[k]);
  const nodes=[A,B,...mids],ex={};
  const exist=async(a,b)=>(await Promise.all(ROUTE_TIERS.map(async tr=>{try{return await getPool(a,b,tr)?tr:null}catch(e){return null}}))).filter(x=>x!==null);
  const jobs=[];for(let i=0;i<nodes.length;i++)for(let k=i+1;k<nodes.length;k++){const x=nodes[i],y=nodes[k];jobs.push(exist(x,y).then(r=>{ex[x+"|"+y]=r;ex[y+"|"+x]=r}))}
  await Promise.all(jobs);
  const E=(a,b)=>ex[a+"|"+b]||[];
  const cands=[];
  const add=(path)=>{ /* path: list of nodes; expand every fee-tier combination */
    let combos=[[]];for(let i=0;i<path.length-1;i++){const t=E(path[i],path[i+1]);if(!t.length)return;combos=combos.flatMap(c=>t.map(tr=>[...c,{a:path[i],b:path[i+1],tier:tr}]))}
    combos.forEach(c=>cands.push(c))};
  add([A,B]);
  mids.forEach(m=>add([A,m,B]));
  mids.forEach(m1=>mids.forEach(m2=>{if(m1!==m2)add([A,m1,m2,B])}));
  if(!cands.length)return null;
  const list=cands.slice(0,60);
  const outs=await Promise.all(list.map(h=>quoteHops(h,amtIn)));
  let best=null;list.forEach((h,i)=>{const o=outs[i];if(o>0n&&(!best||o>best.out||(o===best.out&&h.length<best.hops.length)))best={hops:h,out:o}});
  return best||{hops:null,out:0n};
}
async function runQuote(){
  if([S.fromTok,S.toTok].some(isBlk))return;
  const id=++LIVE.qid,f=S.fromTok,g=S.toTok;
  const msg=m=>{if(id!==LIVE.qid)return;$("rec").textContent="0";$("route").textContent="—";$("okSwap").textContent=m;$("go").disabled=!!S.wallet};
  try{
    const dIn=f==="POL"?18:await decOf(f),dOut=g==="POL"?18:await decOf(g);
    const amtIn=toUnits($("pay").value,dIn);if(amtIn<=0n){msg("");return}
    const wrap=(f==="POL"&&g==="WPOL")||(f==="WPOL"&&g==="POL");
    let out,route,hops=null,tier=0.3;
    if(wrap){out=amtIn;route=t("wrapRoute")}
    else{
      if(W_(f)===W_(g)){msg("");return}
      const best=await findRoute(f,g,amtIn);if(id!==LIVE.qid)return;
      if(!best){msg(t("noRoute"));return}
      if(!best.hops){msg(t("noLiq"));return}
      hops=best.hops;out=best.out;tier=hops[0].tier;
      const chain=[f,...hops.slice(0,-1).map(h=>h.b),g];

    }
    if(id!==LIVE.qid)return;
    const outF=fromUnits(out,dOut),inF=fromUnits(amtIn,dIn),minOut=wrap?out:out*BigInt(10000-Math.round(S.slip*100))/10000n;
    LIVE.quote={f,g,amtIn,out,minOut,dIn,dOut,tier,wrap,hops,route};

    $("rate").textContent=`1 ${f} = ${fmt(inF?outF/inF:0,6)} ${g}`;
    $("route").textContent=route;$("minRec").textContent=`${fmt(fromUnits(minOut,dOut),6)} ${g}`;

async function feeFields(){
  const blk=await rpc("eth_getBlockByNumber",["latest",false]);const base=BigInt(blk.baseFeePerGas||"0x0");
  let tip=LIVE.minTipGwei*10n**9n;try{const s=BigInt(await rpc("eth_maxPriorityFeePerGas",[]));if(s>tip)tip=s}catch(e){}
  return {maxPriorityFeePerGas:"0x"+tip.toString(16),maxFeePerGas:"0x"+(base*2n+tip).toString(16)};
}
async function sendTx(tx){
  await ensureChain();
  const fees=await feeFields();
  /* pre-check first: if the transaction would revert, show the reason instead of letting the wallet guess a huge gas limit */
  try{
    const g=BigInt(await rpc("eth_estimateGas",[{from:LIVE.acct,...tx}]));
    let lim=g*13n/10n;if(lim>30000000n)lim=30000000n;tx={...tx,gas:"0x"+lim.toString(16)};
  }catch(e){
    const r=(e&&e.message)||"";
    throw new Error((LANG==="pt"?"A verificação prévia mostrou que a transação seria recusada pelo contrato, então não foi enviada. Motivo: ":LANG==="es"?"La verificación previa mostró que el contrato rechazaría la transacción, por eso no se envió. Motivo: ":"The pre-check showed the contract would reject this transaction, so it was not sent. Reason: ")+r);
  }
  return eth().request({method:"eth_sendTransaction",params:[{from:LIVE.acct,...tx,...fees}]});
}
async function waitTx(hash){

  throw new Error("timeout");
}

async function execSwap(q,ap){

  try{
    const W=OFF("cWpol"),R=OFF("cRouter"),me=LIVE.acct;
    if(ap){st(t("txApprove"));sp.act(0,t("spW"));const h=await sendTx({to:ADDR(q.f),data:"0x"+SEL.approve+encA(R)+h32(q.amtIn)});
      st(t("txWait")+" "+txLink(h));sp.act(0,t("spN")+" "+txLink(h));if(!await waitTx(h))throw new Error(t("txFail"));sp.done(0);cur=1}
    let tx;

    else{

      let ex;
      if(q.hops&&q.hops.length>1){const p=pathHex(q.hops);ex="0x"+SEL.exactInPath+h32(32)+h32(160)+encA(toPOL?R:me)+h32(dl)+h32(q.amtIn)+h32(q.minOut)+h32(p.length/2)+padHex(p)}
      else{const h0=(q.hops&&q.hops[0])||{tier:q.tier},fee1=Math.round(h0.tier*10000);ex="0x"+SEL.exactIn+encA(ADDR(q.f))+encA(ADDR(q.g))+h32(fee1)+encA(toPOL?R:me)+h32(dl)+h32(q.amtIn)+h32(q.minOut)+h32(0)}
      if(toPOL)tx={to:R,data:encMulticall([ex,"0x"+SEL.unwrap+h32(q.minOut)+encA(me)])};
      else if(q.f==="POL")tx={to:R,data:encMulticall([ex,"0x"+SEL.refund]),value:"0x"+q.amtIn.toString(16)};

    st(t("txSign"));sp.act(cur,t("spW"));const h=await sendTx(tx);st(t("txWait")+" "+txLink(h));sp.act(cur,t("spN")+" "+txLink(h));

}

var BIGOK=null; /* null = unknown, true = provider accepts one wide eth_getLogs, false = must chunk */
async function logsSmart(filter,from,to){
  const hx=n=>"0x"+n.toString(16);
  if(BIGOK!==false){
    try{const r=await rpc("eth_getLogs",[{...filter,fromBlock:hx(from),toBlock:hx(to)}]);BIGOK=true;return r}
    catch(e){if(BIGOK===true&&!(e&&e.rpc))throw e;BIGOK=false}
  }
  const jobs=[];for(let a=from;a<=to;a+=LOG_SPAN)jobs.push([a,Math.min(to,a+LOG_SPAN-1)]);
  const out=[];for(let i=0;i<jobs.length;i+=8){
    const part=await Promise.all(jobs.slice(i,i+8).map(([a,b])=>rpc("eth_getLogs",[{...filter,fromBlock:hx(a),toBlock:hx(b)}])));
    part.forEach(r=>out.push(...r))}
  return out;
}
async function fetchLogs(pool,from,to){
  if(from>to)return [];

async function refreshAdd(R){

  const bad=m=>{R.ok=false;st(m);if($("qgo"))$("qgo").disabled=!!S.wallet};

    const fee=Math.round(R.tier*10000),G=geom(x,y),d0=await decOf(G.t0),d1=await decOf(G.t1),sp=await spacingOf(fee);
    if(id!==R.id)return;

    if(!R.pos&&$("initBox")){R.newPool=!ps.exists;$("initBox").hidden=ps.exists;
      if(!ps.exists)$("initL").textContent=t("initPL",{a:x,b:y})}
    let sP,P; /* P = price of x in y (human) */
    if(ps.exists){sP=ps.sqrtF;const hum=humOf(sP*sP,d0,d1);P=G.aIs0?hum:(hum?1/hum:0)}

    <div class="dfoot"><div class="dchip"><small>${t("distBest")}</small><b>${best}</b></div><div class="dchip"><small>${t("distPos")}</small><b>${pos.length}</b></div><div class="dchip"><small>${t("distTvl")}</small><b>${pvD(d,d.tvlB)}</b></div></div>`}
  host.insertAdjacentHTML("afterend",`<div class="pxc dist" id="ppd"><div class="pxh"><div><strong style="font-size:18px">${t("distT")}</strong></div>
    <div class="filters" role="group">${[["ab",t("unitAB",{a,b})],["ba",t("unitAB",{a:b,b:a})]].map(([k,l])=>`<button data-du="${k}" aria-pressed="${k===DPU}">${l}</button>`).join("")}</div></div>${body}</div>`);
  document.querySelectorAll("#ppd [data-du]").forEach(bt=>bt.onclick=()=>{DPU=bt.dataset.du;drawDist()});
}
