.rng{display:grid;gap:6px;font-size:14px}.rng small{color:var(--muted);font-size:12px;font-family:var(--mono)}.rng span{font-family:var(--mono)}
.rbar{position:relative;height:10px;background:var(--line2);margin:4px 0}
.rbar i{position:absolute;top:0;bottom:0;background:var(--gold);opacity:.55}
.rbar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);transform:translateX(-1px)}
.seg2{grid-template-columns:1fr 1fr}#presets{grid-template-columns:repeat(3,1fr)}
.proto{border-top-color:var(--gold)!important;align-items:flex-start}
.prow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line2)}
.prow .mono{font-family:var(--mono);font-size:13px;grid-column:1}
.prow button{grid-column:2;grid-row:1/span 2}
.mono{font-family:var(--mono)}
#liqB .lbl{display:block;margin-bottom:6px}
.cur{display:block;color:var(--muted);font-size:12px;font-family:var(--mono)}
#liq .sheet{max-height:88vh;overflow:auto}
#liqB,#liqB>*,#liqB .two>*,#liqB .pct button{min-width:0}
#liqB .two select,#liqB .two input{width:100%;min-width:0}
#liqB .pct button{padding:0 4px;font-size:13px}
#liqB .in input{font-size:20px}
.dch{border:1px solid var(--line);background:var(--well);padding:12px;display:grid;gap:8px}
.dch-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.dch-h small{color:var(--muted);font-family:var(--mono);font-size:12px}
.dch svg{width:100%;height:auto;display:block;touch-action:none;cursor:ew-resize;user-select:none}
.dch .dboff{fill:var(--line)}.dch .dbon{fill:var(--gold)}
.dch .dsel{fill:var(--gold);opacity:.12}
.dch .dcur{stroke:var(--text);stroke-width:1.5;stroke-dasharray:4 3}
.dch .dh line{stroke:var(--btn);stroke-width:2}.dch .dh rect{fill:var(--btn)}.dch .dh .grip{stroke:var(--on-btn);stroke-width:1.5}
.dch .ax{fill:var(--muted);font-size:13px;font-family:var(--mono)}
.dch-f{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;font-family:var(--mono);color:var(--muted)}.dch-f b{color:var(--text);font-weight:600}
.psrch{padding:0;display:flex;align-items:center;gap:12px}.psrch input{flex:1}.psrch span{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.nver{font-style:normal;font-size:11px;font-weight:600;color:#7A3E07;background:#FDF1E4;padding:1px 6px;margin-left:4px;white-space:nowrap}
.imp .pair{white-space:normal;min-width:0}.imp .pair span{min-width:0;overflow-wrap:anywhere}.imp .btn{width:100%}.imp,.imp>*{min-width:0}
.imp{margin:0 6px 8px;border:1px solid var(--line);padding:12px;display:grid;gap:10px}.imp .pair span{display:grid;line-height:1.2}.imp small{color:var(--muted);font-weight:400;font-size:12px}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text)}.ck input{margin-top:3px}
.tokb{width:100%;justify-content:space-between;min-height:48px}
.foot{border-top:1px solid var(--line);margin-top:48px;padding:24px 0 32px;background:var(--bg)}
.fwrap{display:grid;gap:10px;padding-bottom:0}
.flinks{display:flex;flex-wrap:wrap;gap:4px 18px}.flinks button{background:none;border:none;padding:8px 0;min-height:36px;color:var(--text);font-weight:500;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.fco{margin:0;font-size:12px;color:var(--muted);font-family:var(--mono)}
.minuta{margin:0 4px 12px;background:#FDF1E4;color:#6B3A07;border:1px solid #F1C99A;padding:8px 10px;font-size:13px}
.docb{padding:0 4px 8px;font-size:15px;line-height:1.6}.docb h4{margin:18px 0 6px;font-size:15px}.docb h5{margin:12px 0 4px;font-size:14px;color:var(--muted)}.docb p{margin:0 0 10px}.docb ul{margin:0 0 10px;padding-left:20px;display:grid;gap:4px}
#gate .ck{font-size:14px;line-height:1.45}#gate .ck a{color:var(--gold);text-decoration:underline}
.big:disabled{opacity:.45;cursor:not-allowed}
.h2r{display:flex;align-items:center;gap:8px}
.gear{width:40px;height:36px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--text)}
.gear:hover{border-color:var(--text)}
.st2{display:block;font-size:15px;margin-bottom:8px}
.sl3{grid-template-columns:1fr 1fr 1fr 1.3fr}
.slc{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--well);padding:0 10px;min-height:44px}
.slc input{border:none;background:transparent;outline:none;width:100%;min-width:0;font-family:var(--mono);font-size:14px;text-align:right}
.slc span{color:var(--muted);font-family:var(--mono);font-size:13px}
.note.warnt{color:#9A5B0B}.note.bad{color:var(--neg)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--pos);font-family:var(--mono)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--pos);animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(30,122,75,.5)}70%{box-shadow:0 0 0 8px rgba(30,122,75,0)}100%{box-shadow:0 0 0 0 rgba(30,122,75,0)}}
@media (prefers-reduced-motion: reduce){.live i{animation:none}}
.extab{min-width:860px}.extab td{font-size:14px}
.extab .tm{color:var(--muted);font-family:var(--mono);font-size:12px}
.extab .amt2{display:flex;align-items:center;gap:6px;font-family:var(--mono)}
.extab .wal{font-family:var(--mono);color:var(--text)}
.extab .lk{color:var(--muted);display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid var(--line)}
.extab tr.new td{animation:nw 1.8s ease-out}
@keyframes nw{from{background:rgba(217,178,106,.22)}to{background:transparent}}
#exNets button{display:inline-flex;align-items:center;gap:6px}
.one-net #netBtn svg.cv,.one-net #netTag svg.cv{display:none}.one-net #netBtn,.one-net #netTag{cursor:default}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pxc{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--btn);padding:18px;display:grid;gap:10px;box-shadow:var(--shadow);min-width:0}
.pxh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pxh .pair{font-size:16px;white-space:nowrap}
.pxv{font-family:var(--mono);font-size:clamp(26px,6vw,36px);font-weight:700;letter-spacing:-.5px;line-height:1.1}
.pxv small{font-size:14px;color:var(--muted);font-weight:500;margin-left:6px}
.pxd{font-family:var(--mono);font-size:13px;font-weight:600}.pxd.up{color:var(--pos)}.pxd.dn{color:var(--neg)}
.pxd span{color:var(--muted);font-weight:400;margin-left:6px}
.pxc .filters button{min-height:34px;padding:4px 12px;font-size:13px;font-family:var(--mono)}
.pxc svg{width:100%;height:auto;display:block;touch-action:pan-y;cursor:crosshair}
.pxc .ax{fill:var(--muted);font-size:11px;font-family:var(--mono)}
.pxc .gl{stroke:var(--line2);stroke-width:1}
.pxn{font-size:12px;color:var(--muted);margin:0}
.pxe{padding:40px 0;text-align:center;color:var(--muted)}
.one-net #netBtn{display:none!important}
@media(max-width:959px){#swap>.card{order:-1}}
.back{display:inline-flex;align-items:center;gap:6px;width:max-content}
.ph2{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ph2 .stack .ico{width:44px;height:44px}
.ph2 h1{font-family:'Instrument Sans',system-ui,sans-serif;font-weight:700;font-size:clamp(24px,5vw,32px);letter-spacing:-.3px;margin:0}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip2{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--surface);padding:3px 8px}
.pprice{text-align:right}.pprice .pbig{font-family:var(--mono);font-weight:700;font-size:clamp(26px,6vw,36px);line-height:1.1}
.pprice .alt{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:4px}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.pstats>div{background:var(--surface);padding:14px 16px;display:grid;gap:3px;align-content:start}
.pstats small{font-family:var(--mono);font-size:12px;color:var(--muted)}.pstats strong{font-family:var(--mono);font-size:20px}.pstats span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.comp{background:var(--surface);border:1px solid var(--line);padding:16px;display:grid;gap:10px}
.cbar{display:flex;height:10px}.cbar i{display:block}
.crow{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:14px}
.addr{background:var(--surface);border:1px solid var(--line);display:grid}
.addr>div{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line2)}
.addr>div:first-child{border-top:none}
.addr code{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.addr .cp{min-height:36px;padding:4px 10px;font-size:12px}
.pacts{display:flex;gap:10px;flex-wrap:wrap}
#pool .panelgrid{display:grid;gap:16px}#pool.panel.on{gap:20px;grid-template-columns:minmax(0,1fr)}#poolBody{display:grid;gap:20px;min-width:0}#poolBody>*{min-width:0}
@media(min-width:960px){#pool .two2{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}}
.ptitle{font-size:18px;margin:8px 0 0}
.pairlink{background:none;border:none;padding:0;color:inherit;cursor:pointer;text-align:left;font:inherit}
.pairlink:hover .ptxt{text-decoration:underline;text-underline-offset:3px}
.pstats strong{white-space:nowrap}
@media(max-width:600px){.pprice{text-align:left;width:100%}.pstats{grid-template-columns:1fr 1fr}.pstats>div:last-child{grid-column:1/-1}.pstats strong{font-size:17px}.ph2 .stack .ico{width:38px;height:38px}}
.navb{display:inline-flex;align-items:center;gap:7px}
.navb .ni{flex:none;opacity:.8}
nav button[aria-selected="true"] .ni{opacity:1;color:var(--gold)}
@media(max-width:760px){header nav .navb{flex-direction:column;gap:3px;font-size:12px;padding:6px 4px;min-height:52px;flex:1}.navb .ni{width:20px;height:20px}}

.kpi strong{font-size:clamp(18px,4.6vw,24px)}

/* textos fixos */
function applyStatic(){
  document.documentElement.lang=LANG==="pt"?"pt-BR":LANG;
  const V={net:NET().name};
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i,V));
  document.querySelectorAll("[data-ih]").forEach(e=>e.innerHTML=t(e.dataset.ih,V));
  document.querySelectorAll("[data-ia]").forEach(e=>e.dataset.ia.split(";").forEach(p=>{const [a,k]=p.split(":");e.setAttribute(a,t(k,V))}));
}
function renderAll(){if(typeof drawPool==="function"&&PP&&$("pool").classList.contains("on"))setTimeout(drawPool);document.documentElement.classList.toggle("one-net",Object.keys(NETS).length<2);applyStatic();paint();drawPools();drawMine();drawStats();drawExNets();drawEx()}


/* troca */
function paint(){
  if($("pxc"))drawPx();
  $("netBtn").innerHTML=nIco("sm")+`<span class="nn">${NET().name}</span>`+cv;
  $("netTag").innerHTML=nIco("sm")+NET().name+cv;
  $("gasVal").textContent=t("gasVal",{net:NET().name,g:NET().gas||"ETH"});
  $("fromTok").innerHTML=tIco(S.fromTok)+S.fromTok+cv;
  $("toTok").innerHTML=tIco(S.toTok)+S.toTok+cv;
  const WI='<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-3px"><rect x="3" y="6" width="18" height="13" rx="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16 12.5h2M3 9h13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  $("wallet").innerHTML=S.wallet?`<span class="hide-sm">0x7a3F…c91E</span><span class="show-sm">0x7a…1E</span>`:`<span class="hide-sm">${t("connect")}</span><span class="show-sm">${WI}</span>`;
  $("wallet").setAttribute("aria-label",S.wallet?"0x7a3F…c91E":t("connect"));
  calc();
}
function calc(){
  const amt=num($("pay").value);
  const f=S.fromTok,g=S.toTok,rate=TOK[f].p/TOK[g].p,out=amt*rate*0.997;
  $("rec").textContent=fmt(out,6);
  $("payUsd").textContent="≈ US$ "+fmt(amt*TOK[f].p,2);
  $("recUsd").textContent="≈ US$ "+fmt(out*TOK[g].p,2);
  $("rate").textContent=`1 ${f} = ${fmt(rate,6)} ${g}`;
  $("route").textContent=`Pool ${f}/${g}`;
  $("slipV").textContent=fmt(S.slip,2)+"%";
  $("minRec").textContent=`${fmt(out*(1-S.slip/100),6)} ${g}`;
  $("go").textContent=S.wallet?t("doSwap"):t("connect");
  $("okSwap").textContent="";
  const rk=swRisk();
  if(rk){if(S.riskTok!==f+g){S.riskOk=false;S.riskTok=f+g}
    $("swWarn").innerHTML=`<div class="warn" style="margin:6px 0 0"><strong>${t("unverT")}</strong><span>${t("swRiskL",{t:[f,g].filter(k=>!isVer(k)).join(", ")})}</span><label class="ck" style="margin-top:6px"><input type="checkbox" id="swOk" ${S.riskOk?"checked":""}> ${t("impRisk")}</label></div>`;
    $("swOk").onchange=e=>{S.riskOk=e.target.checked;$("okSwap").textContent="";$("go").disabled=S.wallet&&!S.riskOk};
    $("go").disabled=S.wallet&&!S.riskOk;
  }else{$("swWarn").innerHTML="";$("go").disabled=false}
  return out;
}
const DOCS={"pt": {"terms": {"t": "Termos de Uso", "h": "<p><strong>Versão de 03/10/2026.<\/strong> Ao conectar sua carteira à KAMBIODEX, você declara que leu e aceita estes Termos.<\/p>\n<h4>1. O que é o serviço<\/h4><p>A KAMBIODEX é uma <strong>interface<\/strong> para contratos inteligentes públicos, baseados no Uniswap v3, na rede Polygon. As trocas e a liquidez acontecem diretamente nesses contratos, a partir da sua carteira. <strong>A KAMBIODEX não guarda seus ativos, não tem acesso às suas chaves e não pode desfazer transações.<\/strong> Os contratos da KAMBIODEX são derivados do código aberto do Uniswap v3 (\u00a9 Uniswap Labs, licenciado sob GPL-2.0-or-later, com os avisos originais mantidos; as alterações estão listadas nos arquivos NOTICE e CHANGES do projeto). A KAMBIODEX não é afiliada, endossada nem patrocinada pela Uniswap Labs; \u201cUniswap\u201d é marca de seu titular.<\/p>\n<h4>2. Quem pode usar<\/h4><ul><li>Pessoas com 18 anos ou mais e plena capacidade civil.<\/li><li>Que não residam nem acessem de países ou regiões bloqueados pela KAMBIODEX.<\/li><li>Cujas carteiras não constem em listas de sanções nacionais ou internacionais.<\/li><\/ul>\n<h4>3. Taxas<\/h4><p>Cada troca paga a taxa da pool usada (0,01%, 0,05%, 0,30% ou 1%), cobrada pelo próprio contrato. Parte dessa taxa vai para quem fornece liquidez e parte para a KAMBIODEX. A rede também cobra gás, pago na moeda da rede.<\/p>\n<h4>4. Suas responsabilidades<\/h4><ul><li>Conferir tokens, endereços, valores, tolerância de preço e faixas antes de assinar.<\/li><li>Guardar sua frase de recuperação. Quem tem a chave controla os fundos.<\/li><li>Usar o serviço apenas para fins lícitos e cumprir as leis do seu país, inclusive tributárias.<\/li><\/ul>\n<h4>5. Tokens de terceiros<\/h4><p>Qualquer pessoa pode criar tokens e pools. A KAMBIODEX não emite, não endossa e não garante nenhum token. O selo \"Verificado\" indica apenas que o endereço foi conferido; não é recomendação de investimento.<\/p>\n<h4>6. Condutas proibidas<\/h4><p>Lavagem de dinheiro, financiamento ao terrorismo, fraude, manipulação de preços, uso de tokens falsos, tentativa de contornar bloqueios de acesso ou qualquer uso que viole a lei.<\/p>\n<h4>7. Bloqueio de acesso<\/h4><p>A KAMBIODEX pode negar o acesso à interface a carteiras sancionadas, ligadas a atividades ilícitas, apontadas por ordem de autoridade, ou a acessos vindos de regiões bloqueadas, sem aviso prévio.<\/p>\n<h4>8. Limitação de responsabilidade<\/h4><p>O serviço é oferecido \"no estado em que se encontra\". Na extensão permitida em lei, a KAMBIODEX não responde por perdas decorrentes de variação de preços, falhas de contratos inteligentes, das redes, de carteiras de terceiros, de tokens criados por terceiros ou de erros do usuário.<\/p>\n<h4>9. Privacidade e proteção de dados<\/h4><h5>1. Dados que tratamos<\/h5><ul><li>Endereço público da carteira conectada.<\/li><li>Endereço IP, país aproximado, data e hora de acesso.<\/li><li>Registro do aceite destes documentos (versão, data e hora).<\/li><li>Tokens importados e eventos de uso da interface.<\/li><\/ul><p><strong>Não pedimos<\/strong> nome, CPF, documentos, e-mail ou dados bancários.<\/p>\n<h5>2. Para que usamos<\/h5><ul><li>Segurança e prevenção a fraudes, golpes e lavagem de dinheiro.<\/li><li>Triagem da carteira em listas de sanções.<\/li><li>Cumprimento de obrigações legais, como a guarda de registros de acesso.<\/li><\/ul>\n<h5>3. Bases legais<\/h5><p>Cumprimento de obrigação legal ou regulatória e legítimo interesse em proteger o serviço e os usuários.<\/p>\n<h5>4. Compartilhamento<\/h5><p>Com provedores de hospedagem e segurança (como Cloudflare), com serviços de triagem de sanções (como Chainalysis) e com autoridades, somente mediante ordem judicial ou obrigação legal.<\/p>\n<h5>5. Por quanto tempo<\/h5><p>Registros de acesso são guardados por <strong>6 meses<\/strong> (Marco Civil, art. 15) e depois apagados, salvo pedido de preservação de autoridade.<\/p>\n<h5>6. Blockchain é pública<\/h5><p>Transações feitas nas redes são públicas e permanentes. Ninguém, nem a KAMBIODEX, consegue alterá-las ou apagá-las.<\/p>\n<h5>7. Seus direitos<\/h5><p>Você pode pedir confirmação, acesso, correção, anonimização ou eliminação de dados, nos limites da lei, pelos canais oficiais da KAMBIODEX.<\/p><h4>10. Prevenção à lavagem de dinheiro e a golpes<\/h4><h5>Medidas contra lavagem de dinheiro<\/h5><ul><li><strong>Triagem de carteiras<\/strong> em listas de sanções (como OFAC e ONU) antes da conexão.<\/li><li><strong>Lista de bloqueio própria<\/strong> para carteiras apontadas por autoridades ou envolvidas em ilícitos.<\/li><li><strong>Bloqueio geográfico<\/strong> de países e regiões sancionados.<\/li><li><strong>Registros de acesso<\/strong> guardados por 6 meses e fornecidos a autoridades mediante ordem judicial.<\/li><li><strong>Cooperação<\/strong> com autoridades nos termos da lei.<\/li><\/ul>\n<h5>Medidas contra tokens fraudulentos<\/h5><ul><li>Lista de tokens verificados por rede.<\/li><li>Alerta e confirmação obrigatória para tokens fora da lista.<\/li><li>Bloqueio, na interface, de tokens identificados como golpe.<\/li><li>Leitura dos dados do token direto da blockchain.<\/li><li>Selo \"Não verificado\" nas pools com esses tokens.<\/li><\/ul>\n<h5>Limites<\/h5><p>Os contratos inteligentes são públicos e podem ser acessados sem a interface. As medidas desta política valem para o que a KAMBIODEX controla: o site e a interface.<\/p><h4>11. Alterações<\/h4><p>Estes Termos podem mudar. A cada nova versão, você precisará aceitá-los de novo ao conectar a carteira.<\/p>\n<h4>12. Lei e foro<\/h4><p>Aplica-se a lei brasileira. Fica eleito o foro da comarca de [Comarca], ressalvados os direitos do consumidor.<\/p>"}, "risks": {"t": "Aviso de Riscos", "h": "<p><strong>Leia com atenção. Você pode perder parte ou todo o valor usado.<\/strong><\/p>\n<ul><li><strong>Volatilidade:<\/strong> preços de criptoativos podem cair muito em pouco tempo.<\/li>\n<li><strong>Tokens falsos e golpes:<\/strong> qualquer pessoa pode criar um token com nome igual ao de um projeto conhecido. Confira sempre o endereço do contrato.<\/li>\n<li><strong>Perda impermanente:<\/strong> quem fornece liquidez pode terminar com menos valor do que se tivesse apenas guardado as moedas.<\/li>\n<li><strong>Faixa de preço:<\/strong> fora da faixa escolhida, a posição para de render e fica 100% em uma das moedas.<\/li>\n<li><strong>Contratos inteligentes:<\/strong> mesmo códigos auditados podem ter falhas exploradas por terceiros.<\/li>\n<li><strong>Transações irreversíveis:<\/strong> envio para endereço errado ou aprovação de contrato malicioso não podem ser desfeitos.<\/li>\n<li><strong>Chave da carteira:<\/strong> quem perde a frase de recuperação perde os fundos; quem a revela pode ter os fundos roubados.<\/li>\n<li><strong>Preço e robôs:<\/strong> o preço final pode variar até o limite da tolerância definida; robôs podem antecipar operações.<\/li>\n<li><strong>Redes e regulação:<\/strong> as redes podem ficar instáveis, e as regras sobre criptoativos podem mudar.<\/li><\/ul>\n<p>Nada na KAMBIODEX é recomendação de investimento. Decida por conta própria e, se precisar, procure um profissional.<\/p>"}}, "en": {"terms": {"t": "Terms of Use", "h": "<p><strong>Version of 2026-10-03.<\/strong> By connecting your wallet to KAMBIODEX, you confirm you have read and accept these Terms.<\/p>\n<h4>1. The service<\/h4><p>KAMBIODEX is an <strong>interface<\/strong> to public smart contracts based on Uniswap v3 on Polygon. Swaps and liquidity happen directly in those contracts, from your wallet. <strong>KAMBIODEX does not hold your assets, has no access to your keys and cannot reverse transactions.<\/strong> KAMBIODEX contracts are derived from the open-source code of Uniswap v3 (\u00a9 Uniswap Labs, licensed under GPL-2.0-or-later, with the original notices kept; the changes are listed in the project\u2019s NOTICE and CHANGES files). KAMBIODEX is not affiliated with, endorsed by or sponsored by Uniswap Labs; \u201cUniswap\u201d is a trademark of its owner.<\/p>\n<h4>2. Eligibility<\/h4><ul><li>You are 18 or older and legally capable.<\/li><li>You do not reside in or access from countries or regions blocked by KAMBIODEX.<\/li><li>Your wallet is not on national or international sanctions lists.<\/li><\/ul>\n<h4>3. Fees<\/h4><p>Each swap pays the fee of the pool used (0.01%, 0.05%, 0.30% or 1%), charged by the contract itself. Part goes to liquidity providers and part to KAMBIODEX. The network also charges gas in its native currency.<\/p>\n<h4>4. Your responsibilities<\/h4><ul><li>Check tokens, addresses, amounts, price tolerance and ranges before signing.<\/li><li>Keep your recovery phrase safe. Whoever holds the key controls the funds.<\/li><li>Use the service only for lawful purposes and comply with your local laws, including tax laws.<\/li><\/ul>\n<h4>5. Third-party tokens<\/h4><p>Anyone can create tokens and pools. KAMBIODEX does not issue, endorse or guarantee any token. The \"Verified\" badge only means the address was checked; it is not investment advice.<\/p>\n<h4>6. Prohibited conduct<\/h4><p>Money laundering, terrorist financing, fraud, price manipulation, fake tokens, attempts to bypass access blocks or any unlawful use.<\/p>\n<h4>7. Access restrictions<\/h4><p>KAMBIODEX may deny interface access to sanctioned wallets, wallets linked to illicit activity or named by authorities, and to access from blocked regions, without prior notice.<\/p>\n<h4>8. Limitation of liability<\/h4><p>The service is provided \"as is\". To the extent permitted by law, KAMBIODEX is not liable for losses from price changes, failures of smart contracts, networks, third-party wallets, third-party tokens, or user error.<\/p>\n<h4>9. Privacy and data protection<\/h4><h5>1. Data we process<\/h5><ul><li>Public address of the connected wallet.<\/li><li>IP address, approximate country, date and time of access.<\/li><li>Record of your acceptance of these documents (version, date and time).<\/li><li>Imported tokens and interface usage events.<\/li><\/ul><p>We <strong>do not ask<\/strong> for your name, ID, email or bank details.<\/p>\n<h5>2. Purposes<\/h5><ul><li>Security and prevention of fraud, scams and money laundering.<\/li><li>Screening your wallet against sanctions lists.<\/li><li>Compliance with legal duties, such as keeping access logs.<\/li><\/ul>\n<h5>3. Legal bases<\/h5><p>Compliance with legal or regulatory obligations and legitimate interest in protecting the service and its users.<\/p>\n<h5>4. Sharing<\/h5><p>With hosting and security providers (such as Cloudflare), sanctions screening services (such as Chainalysis), and authorities only under court order or legal obligation.<\/p>\n<h5>5. Retention<\/h5><p>Access logs are kept for <strong>6 months<\/strong> (Internet Civil Framework, art. 15) and then deleted, unless an authority requests preservation.<\/p>\n<h5>6. Blockchains are public<\/h5><p>Transactions on the networks are public and permanent. No one, including KAMBIODEX, can change or delete them.<\/p>\n<h5>7. Your rights<\/h5><p>You may request confirmation, access, correction, anonymization or deletion of data, within legal limits, through KAMBIODEX's official channels.<\/p><h4>10. Anti-money laundering and anti-scam measures<\/h4><h5>Anti-money laundering measures<\/h5><ul><li><strong>Wallet screening<\/strong> against sanctions lists (such as OFAC and UN) before connection.<\/li><li><strong>Internal blocklist<\/strong> for wallets named by authorities or involved in illicit activity.<\/li><li><strong>Geoblocking<\/strong> of sanctioned countries and regions.<\/li><li><strong>Access logs<\/strong> kept for 6 months and provided to authorities under court order.<\/li><li><strong>Cooperation<\/strong> with authorities as required by law.<\/li><\/ul>\n<h5>Measures against fraudulent tokens<\/h5><ul><li>Verified token list per network.<\/li><li>Warning and mandatory confirmation for tokens outside the list.<\/li><li>Interface-level blocking of tokens identified as scams.<\/li><li>Token data read directly from the blockchain.<\/li><li>\"Unverified\" badge on pools with such tokens.<\/li><\/ul>\n<h5>Limits<\/h5><p>The smart contracts are public and can be used without the interface. These measures apply to what KAMBIODEX controls: the website and interface.<\/p><h4>11. Changes<\/h4><p>These Terms may change. Each new version must be accepted again when you connect your wallet.<\/p>\n<h4>12. Governing law<\/h4><p>Brazilian law applies. The courts of [Comarca], Brazil, have jurisdiction, without prejudice to consumer rights.<\/p>"}, "risks": {"t": "Risk Notice", "h": "<p><strong>Read carefully. You may lose part or all of the value you use.<\/strong><\/p>\n<ul><li><strong>Volatility:<\/strong> crypto prices can fall sharply in a short time.<\/li>\n<li><strong>Fake tokens and scams:<\/strong> anyone can create a token with the same name as a well-known project. Always check the contract address.<\/li>\n<li><strong>Impermanent loss:<\/strong> liquidity providers may end up with less value than if they had simply held the tokens.<\/li>\n<li><strong>Price range:<\/strong> outside the chosen range, a position stops earning and is 100% in one token.<\/li>\n<li><strong>Smart contracts:<\/strong> even audited code can have flaws exploited by others.<\/li>\n<li><strong>Irreversible transactions:<\/strong> sending to a wrong address or approving a malicious contract cannot be undone.<\/li>\n<li><strong>Wallet keys:<\/strong> losing your recovery phrase means losing your funds; revealing it can get them stolen.<\/li>\n<li><strong>Price and bots:<\/strong> the final price may move up to your tolerance limit; bots may front-run trades.<\/li>\n<li><strong>Networks and regulation:<\/strong> networks can become unstable and crypto rules can change.<\/li><\/ul>\n<p>Nothing on KAMBIODEX is investment advice. Decide for yourself and seek professional advice if needed.<\/p>"}}, "es": {"terms": {"t": "Términos de Uso", "h": "<p><strong>Versión del 03/10/2026.<\/strong> Al conectar tu billetera a KAMBIODEX, declaras haber leído y aceptado estos Términos.<\/p>\n<h4>1. El servicio<\/h4><p>KAMBIODEX es una <strong>interfaz<\/strong> para contratos inteligentes públicos basados en Uniswap v3 en Polygon. Los intercambios y la liquidez ocurren directamente en esos contratos, desde tu billetera. <strong>KAMBIODEX no custodia tus activos, no tiene acceso a tus claves y no puede revertir transacciones.<\/strong> Los contratos de KAMBIODEX derivan del código abierto de Uniswap v3 (\u00a9 Uniswap Labs, licenciado bajo GPL-2.0-or-later, con los avisos originales conservados; los cambios están listados en los archivos NOTICE y CHANGES del proyecto). KAMBIODEX no está afiliada, respaldada ni patrocinada por Uniswap Labs; \u201cUniswap\u201d es marca de su titular.<\/p>\n<h4>2. Quién puede usarlo<\/h4><ul><li>Personas de 18 años o más y con plena capacidad legal.<\/li><li>Que no residan ni accedan desde países o regiones bloqueados por KAMBIODEX.<\/li><li>Cuyas billeteras no figuren en listas de sanciones nacionales o internacionales.<\/li><\/ul>\n<h4>3. Comisiones<\/h4><p>Cada intercambio paga la comisión del pool usado (0,01%, 0,05%, 0,30% o 1%), cobrada por el propio contrato. Una parte va a los proveedores de liquidez y otra a KAMBIODEX. La red también cobra gas en su moneda.<\/p>\n<h4>4. Tus responsabilidades<\/h4><ul><li>Verificar tokens, direcciones, montos, tolerancia de precio y rangos antes de firmar.<\/li><li>Guardar tu frase de recuperación. Quien tiene la clave controla los fondos.<\/li><li>Usar el servicio solo con fines lícitos y cumplir las leyes de tu país, incluidas las tributarias.<\/li><\/ul>\n<h4>5. Tokens de terceros<\/h4><p>Cualquiera puede crear tokens y pools. KAMBIODEX no emite, no respalda ni garantiza ningún token. El sello \"Verificado\" solo indica que la dirección fue revisada; no es recomendación de inversión.<\/p>\n<h4>6. Conductas prohibidas<\/h4><p>Lavado de dinero, financiamiento del terrorismo, fraude, manipulación de precios, tokens falsos, intentos de eludir bloqueos de acceso o cualquier uso ilícito.<\/p>\n<h4>7. Bloqueo de acceso<\/h4><p>KAMBIODEX puede negar el acceso a la interfaz a billeteras sancionadas, vinculadas a actividades ilícitas o señaladas por autoridades, y a accesos desde regiones bloqueadas, sin aviso previo.<\/p>\n<h4>8. Limitación de responsabilidad<\/h4><p>El servicio se ofrece \"tal cual\". En la medida permitida por la ley, KAMBIODEX no responde por pérdidas derivadas de variaciones de precio, fallas de contratos inteligentes, de las redes, de billeteras de terceros, de tokens de terceros o de errores del usuario.<\/p>\n<h4>9. Privacidad y protección de datos<\/h4><h5>1. Datos que tratamos<\/h5><ul><li>Dirección pública de la billetera conectada.<\/li><li>Dirección IP, país aproximado, fecha y hora de acceso.<\/li><li>Registro de la aceptación de estos documentos (versión, fecha y hora).<\/li><li>Tokens importados y eventos de uso de la interfaz.<\/li><\/ul><p><strong>No pedimos<\/strong> nombre, documentos, correo ni datos bancarios.<\/p>\n<h5>2. Finalidades<\/h5><ul><li>Seguridad y prevención de fraudes, estafas y lavado de dinero.<\/li><li>Verificación de la billetera en listas de sanciones.<\/li><li>Cumplimiento de obligaciones legales, como la guarda de registros de acceso.<\/li><\/ul>\n<h5>3. Bases legales<\/h5><p>Cumplimiento de obligación legal o regulatoria e interés legítimo en proteger el servicio y a los usuarios.<\/p>\n<h5>4. Compartición<\/h5><p>Con proveedores de alojamiento y seguridad (como Cloudflare), servicios de verificación de sanciones (como Chainalysis) y autoridades, solo por orden judicial u obligación legal.<\/p>\n<h5>5. Conservación<\/h5><p>Los registros de acceso se guardan <strong>6 meses<\/strong> (Marco Civil, art. 15) y luego se eliminan, salvo pedido de preservación de una autoridad.<\/p>\n<h5>6. La blockchain es pública<\/h5><p>Las transacciones en las redes son públicas y permanentes. Nadie, ni KAMBIODEX, puede modificarlas o borrarlas.<\/p>\n<h5>7. Tus derechos<\/h5><p>Puedes solicitar confirmación, acceso, corrección, anonimización o eliminación de datos, dentro de los límites legales, por los canales oficiales de KAMBIODEX.<\/p><h4>10. Prevención del lavado de dinero y de estafas<\/h4><h5>Medidas contra el lavado de dinero<\/h5><ul><li><strong>Verificación de billeteras<\/strong> en listas de sanciones (como OFAC y ONU) antes de conectar.<\/li><li><strong>Lista de bloqueo propia<\/strong> para billeteras señaladas por autoridades o involucradas en ilícitos.<\/li><li><strong>Bloqueo geográfico<\/strong> de países y regiones sancionados.<\/li><li><strong>Registros de acceso<\/strong> guardados 6 meses y entregados a autoridades por orden judicial.<\/li><li><strong>Cooperación<\/strong> con las autoridades según la ley.<\/li><\/ul>\n<h5>Medidas contra tokens fraudulentos<\/h5><ul><li>Lista de tokens verificados por red.<\/li><li>Alerta y confirmación obligatoria para tokens fuera de la lista.<\/li><li>Bloqueo, en la interfaz, de tokens identificados como estafa.<\/li><li>Datos del token leídos directamente de la blockchain.<\/li><li>Sello \"No verificado\" en pools con esos tokens.<\/li><\/ul>\n<h5>Límites<\/h5><p>Los contratos inteligentes son públicos y pueden usarse sin la interfaz. Estas medidas aplican a lo que KAMBIODEX controla: el sitio y la interfaz.<\/p><h4>11. Cambios<\/h4><p>Estos Términos pueden cambiar. Cada nueva versión deberá aceptarse de nuevo al conectar la billetera.<\/p>\n<h4>12. Ley y jurisdicción<\/h4><p>Se aplica la ley brasileña. Son competentes los tribunales de [Comarca], Brasil, sin perjuicio de los derechos del consumidor.<\/p>"}, "risks": {"t": "Aviso de Riesgos", "h": "<p><strong>Lee con atención. Puedes perder parte o todo el valor usado.<\/strong><\/p>\n<ul><li><strong>Volatilidad:<\/strong> los precios de los criptoactivos pueden caer const DW=600,DH=170,NB=56;

    bins.push(0.06+Math.exp(-z*z)+0.35*Math.exp(-z2*z2)+0.25*Math.exp(-z3*z3)+0.12*r())}
  return {d0,d1,bins};
}

  const lo=X(R.lo),hi=X(R.hi),pp=X(P);let tot=0,inR=0;
  const bars=bins.map((h,i)=>{const v0=d0+i*(d1-d0)/NB,v1=v0+(d1-d0)/NB,on=v1>R.lo&&v0<R.hi;tot+=h;if(on)inR+=h;const hh=h/mx*(DH-24);
    return`<rect class="${on?"dbon":"dboff"}" x="${(i*bw+bw*.12).toFixed(1)}" y="${(DH-hh).toFixed(1)}" width="${(bw*.76).toFixed(1)}" height="${hh.toFixed(1)}"/>`}).join('');
  const hd=(xx,k)=>`<g class="dh" data-h="${k}"><line x1="${xx}" x2="${xx}" y1="0" y2="${DH}"/><rect x="${xx-7}" y="${DH/2-18}" width="14" height="36"/><line class="grip" x1="${xx-2}" x2="${xx-2}" y1="${DH/2-8}" y2="${DH/2+8}"/><line class="grip" x1="${xx+2}" x2="${xx+2}" y1="${DH/2-8}" y2="${DH/2+8}"/></g>`;

   </svg>
   <div class="dch-f"><span>${t("curP")}: <b>${fmtP(P)}</b> ${t("per",{a:x,b:y})}</span><span>${t("liqCover",{x:fmt(tot?inR/tot*100:0,0)})}</span></div>

let PXP="1D",PXHOV=null;

function pxSeries(a,b){
  const P=PX(a,b);if(!(P>0))return null;
  let sd=7;for(const c of a+b+PXP)sd=(sd*31+c.charCodeAt(0))%2147483647;const r=()=>{sd=(sd*16807)%2147483647;return (sd-1)/2147483646};
  const n=PXN[PXP],v=PXVOL[PXP],out=[P];let x=P;

  const now=Date.now();return out.map((y,i)=>({y,t:now-(n-1-i)*PXSTEP[PXP]}));
}

    <div><small>${t("aprEst")}</small><strong style="color:var(--gold)">${fmt(apr,1)}%</strong></div>
  </div>
  <div class="two2"><div class="pxc" id="ppx"></div>
   <div class="panelgrid">
    <div class="comp"><strong>${t("compT")}</strong><div class="cbar"><i style="width:50%;background:var(--btn)"></i><i style="width:50%;background:var(--gold)"></i></div>
      <div class="crow"><span>${tIco(a,"sm")} ${a}</span><span>${fmt(ra,2)} · 50%</span></div><div class="crow"><span>${tIco(b,"sm")} ${b}</span><span>${fmt(rb,2)} · 50%</span></div></div>
    <div class="pacts"><button class="btn" id="ppSwap">${t("tradePair")}</button><button class="ghost" id="ppAdd">${t("addLiq")}</button></div>
   </div></div>
  <h2 class="ptitle">${t("lastTrades")}</h2>
  <div class="tablew"><table class="extab"><thead><tr><th>${t("thTime")}</th><th>${t("thValue")}</th><th>${t("thIn")}</th><th>${t("thOut")}</th><th>${t("thWallet")}</th></tr></thead><tbody>
   ${trades.map(x=>`<tr><td class="tm">${ago(x.t)}</td><td>US$ ${fmt(x.usd,2)}</td><td><span class="amt2">${tIco(x.tin,"sm")}${fmt(x.ain,x.ain<1?6:2)} ${x.tin}</span></td><td><span class="amt2">${tIco(x.tout,"sm")}${fmt(x.aout,x.aout<1?6:2)} ${x.tout}</span></td><td><span class="wal" title="${x.w}">${short(x.w)}</span></td></tr>`).join('')||`<tr><td colspan="5" style="color:var(--muted)">${t("exNone")}</td></tr>`}
  </tbody></table></div>
  <p class="note" style="text-align:left">${t("poolNote")}</p>`;
  drawPoolChart(units);
  $("ppSwap").onclick=()=>{if(NET().tokens.includes(a)&&NET().tokens.includes(b)){S.fromTok=a;S.toTok=b}document.querySelector('nav [data-tab="swap"]').click()};
  $("ppAdd").onclick=()=>openAdd(a,b,false,null,tr);
}
function drawPoolChart(units){
  const {a,b}=PP,el=$("ppx");const save=[PXP,PXHOV];PXP=PPP;PXHOV=null;
  let D=pxSeries(a,b);PXP=save[0];PXHOV=save[1];
  if(!D){el.innerHTML=`<div class="pxe">${t("chNoPool")}</div>`;return}
  if(PPU==="ba")D=D.map(d=>({t:d.t,y:1/d.y}));else if(PPU==="usd")D=D.map(d=>({t:d.t,y:d.y*(TOK[b].p||1)}));
  const W=600,H=240,ys=D.map(d=>d.y),mn=Math.min(...ys),mx=Math.max(...ys),pad=(mx-mn)*.12||mx*.01,lo=mn-pad,hi=mx+pad,X=i=>i/(D.length-1)*W,Y=v=>H-(v-lo)/(hi-lo)*H;
  const pts=D.map((d,i)=>`${X(i).toFixed(1)},${Y(d.y).toFixed(1)}`).join(" "),ch=(D[D.length-1].y-D[0].y)/D[0].y*100,col=ch>=0?"var(--pos)":"var(--neg)";
  const tf=new Intl.DateTimeFormat(LOC[LANG],PPP==="1H"||PPP==="1D"?{hour:"2-digit",minute:"2-digit"}:{day:"2-digit",month:"2-digit"});
  el.innerHTML=`<div class="pxh"><div class="filters" role="group">${units.map(([k,l])=>`<button data-u="${k}" aria-pressed="${k===PPU}">${l}</button>`).join('')}</div>
   <div class="filters" role="group" aria-label="${t("period")}">${["1H","1D","1W","1M"].map(k=>`<button data-p="${k}" aria-pressed="${k===PPP}">${t("p"+k)}</button>`).join('')}</div></div>
   <svg viewBox="0 -6 ${W} ${H+30}" role="img" aria-label="${t("chT")}">${[.25,.5,.75].map(f=>`<line class="gl" x1="0" x2="${W}" y1="${H*f}" y2="${H*f}"/>`).join('')}
   <polygon points="0,${H} ${pts} ${W},${H}" fill="${col}" opacity=".10"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>
   <text class="ax" x="0" y="${H+20}">${tf.format(D[0].t)}</text><text class="ax" x="${W}" y="${H+20}" text-anchor="end">${tf.format(D[D.length-1].t)}</text>
   <text class="ax" x="${W}" y="12" text-anchor="end">${fmtP(D[D.length-1].y)}</text></svg>
   <p class="pxn">${t("chSrc")}</p>`;
  el.querySelectorAll("[data-u]").forEach(x=>x.onclick=()=>{PPU=x.dataset.u;drawPoolChart(units)});
  el.querySelectorAll("[data-p]").forEach(x=>x.onclick=()=>{PPP=x.dataset.p;drawPoolChart(units)});
}
$("poolBack").onclick=()=>{location.hash="";document.querySelector('nav [data-tab="pools"]').click()};
document.addEventListener("click",e=>{const b=e.target.closest("[data-pool]");if(b){const [x,y,tr]=b.dataset.pool.split("|");openPool(x,y,tr)}});
function routeHash(){const m=location.hash.match(/^#\/pool\/([^-]+)-([^-]+)-([\d.]+)/);if(m&&TOK[m[1]]&&TOK[m[2]])openPool(m[1],m[2],m[3])}
/* abas */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  if(location.hash)history.replaceState(null,"",location.pathname+location.search);
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id===b.dataset.tab));
  scrollTo({top:0});
});

paintTheme();
renderAll();
routeHash();
</script>
